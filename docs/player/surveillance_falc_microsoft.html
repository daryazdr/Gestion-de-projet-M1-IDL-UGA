<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ecouter en francais</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f7f9fc, #e7eef8);
      font-family: Arial, sans-serif;
      color: #10243e;
    }
    .card {
      width: min(94vw, 640px);
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 14px 30px rgba(16, 36, 62, 0.15);
      text-align: center;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 1.6rem;
      word-break: break-word;
    }
    .controls {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(2, 1fr);
      margin-top: 16px;
    }
    button {
      min-height: 96px;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      color: white;
      background: #1f6feb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 700;
    }
    .icon {
      font-size: 2.2rem;
      line-height: 1;
    }
    .txt {
      font-size: 1rem;
      line-height: 1;
    }
    button.primary {
      background: #1761cc;
    }
    button.secondary {
      background: #1f7a3a;
    }
    .time {
      margin-top: 16px;
      font-size: 1.05rem;
      color: #2f4868;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Ecouter en francais</h1>
    <audio id="player" preload="metadata" src="https://daryazdr.github.io/Gestion-de-projet-M1-IDL-UGA/audio/surveillance_falc_microsoft.mp3"></audio>

    <div class="controls">
      <button type="button" class="primary" aria-label="Reculer 5 secondes" onclick="seek(-5)">
        <span class="icon">⏪</span>
        <span class="txt">5 sec</span>
      </button>
      <button type="button" class="primary" aria-label="Avancer 5 secondes" onclick="seek(5)">
        <span class="icon">⏩</span>
        <span class="txt">5 sec</span>
      </button>
      <button type="button" class="secondary" aria-label="Lecture" onclick="playAudio()">
        <span class="icon">▶</span>
        <span class="txt">Play</span>
      </button>
      <button type="button" class="secondary" aria-label="Pause" onclick="pauseAudio()">
        <span class="icon">⏸</span>
        <span class="txt">Pause</span>
      </button>
    </div>

    <p class="time" id="time">00:00 / 00:00</p>
  </main>

  <script>
    const player = document.getElementById('player');
    const timeEl = document.getElementById('time');

    function fmt(s) {
      if (!Number.isFinite(s)) return '00:00';
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    function refreshTime() {
      timeEl.textContent = `${fmt(player.currentTime)} / ${fmt(player.duration)}`;
    }

    function playAudio() { player.play(); }
    function pauseAudio() { player.pause(); }
    function seek(delta) {
      const maxDuration = Number.isFinite(player.duration) ? player.duration : player.currentTime + delta;
      const next = Math.max(0, Math.min(maxDuration, player.currentTime + delta));
      player.currentTime = next;
      refreshTime();
    }

    player.addEventListener('timeupdate', refreshTime);
    player.addEventListener('loadedmetadata', refreshTime);
  </script>
</body>
</html>
