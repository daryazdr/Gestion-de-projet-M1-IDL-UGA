<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>surveillance_ru_deepl</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #f7f9fc, #e7eef8);
      font-family: Arial, sans-serif;
      color: #10243e;
    }
    .card {
      width: min(92vw, 560px);
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 14px 30px rgba(16, 36, 62, 0.15);
      text-align: center;
    }
    h1 {
      margin: 0 0 18px;
      font-size: 1.35rem;
      word-break: break-word;
    }
    .controls {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(2, 1fr);
      margin-top: 12px;
    }
    button {
      min-height: 56px;
      border: none;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      color: white;
      background: #1f6feb;
    }
    button.secondary {
      background: #2b8a3e;
    }
    .time {
      margin-top: 14px;
      font-size: 1rem;
      color: #2f4868;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>surveillance_ru_deepl</h1>
    <audio id="player" preload="metadata" src="https://daryazdr.github.io/Gestion-de-projet-M1-IDL-UGA/audio/surveillance_ru_deepl.mp3"></audio>

    <div class="controls">
      <button type="button" onclick="seek(-5)">- 5 sec</button>
      <button type="button" onclick="seek(5)">+ 5 sec</button>
      <button type="button" class="secondary" onclick="playAudio()">Play</button>
      <button type="button" class="secondary" onclick="pauseAudio()">Pause</button>
    </div>

    <p class="time" id="time">00:00 / 00:00</p>
  </main>

  <script>
    const player = document.getElementById('player');
    const timeEl = document.getElementById('time');

    function fmt(s) {
      if (!Number.isFinite(s)) return '00:00';
      const m = Math.floor(s / 60).toString().padStart(2, '0');
      const sec = Math.floor(s % 60).toString().padStart(2, '0');
      return `${m}:${sec}`;
    }

    function refreshTime() {
      timeEl.textContent = `${fmt(player.currentTime)} / ${fmt(player.duration)}`;
    }

    function playAudio() { player.play(); }
    function pauseAudio() { player.pause(); }
    function seek(delta) {
      const maxDuration = Number.isFinite(player.duration) ? player.duration : player.currentTime + delta;
      const next = Math.max(0, Math.min(maxDuration, player.currentTime + delta));
      player.currentTime = next;
      refreshTime();
    }

    player.addEventListener('timeupdate', refreshTime);
    player.addEventListener('loadedmetadata', refreshTime);
  </script>
</body>
</html>
